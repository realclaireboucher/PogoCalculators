<!DOCTYPE html>
<html>
<head>
    <title>Pokémon GO Trade Calculator</title>
    <link rel="stylesheet" href="volcarona-theme.css">
    <style>
        /* Page-specific styles */
        .trade-sides {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .trade-side {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #ddd;
            transition: all 0.3s ease;
        }

        .trade-side:hover {
            border-color: #ff6b35;
            box-shadow: 0 2px 15px rgba(255, 107, 53, 0.2);
        }

        h3 {
            margin-top: 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f2f5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            font-weight: 600;
        }

        #pokemonImage, #pokemonImage1, #pokemonImage2 {
            max-width: 200px;
            max-height: 200px;
            margin-top: 20px;
        }
        
        .friendship-section {
            margin: 20px 0;
            padding: 20px;
            background: linear-gradient(135deg, #fff5e6, #ffe4cc);
            border-radius: 5px;
            border-left: 4px solid #ff6b35;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pokémon GO Trade Calculator</h1>
        
        <div class="trade-sides">
            <div class="trade-side">
                <h3>Your Pokémon</h3>
                <div class="form-group">
                    <label for="item1">Select Pokémon:</label>
                    <select id="item1" onchange="updatePokemonImage(this, 'pokemonImage1')"></select>
                </div>
                <img id="pokemonImage1" src="" alt="Selected Pokémon">
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="registered1">
                    <label for="registered1">Pokémon is Registered</label>
                </div>
            </div>

            <div class="trade-side">
                <h3>Their Pokémon</h3>
                <div class="form-group">
                    <label for="item2">Select Pokémon:</label>
                    <select id="item2" onchange="updatePokemonImage(this, 'pokemonImage2')"></select>
                </div>
                <img id="pokemonImage2" src="" alt="Selected Pokémon">
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="registered2">
                    <label for="registered2">Pokémon is Registered</label>
                </div>
            </div>
        </div>

        <div class="friendship-section">
            <div class="form-group">
                <label for="friendship">Friendship Level:</label>
                <select id="friendship">
                    <option value="1.0">Stranger (No Discount)</option>
                    <option value="0.8">Great Friend (20% Off)</option>
                    <option value="0.08">Ultra Friend (92% Off)</option>
                    <option value="0.04">Best Friend (96% Off)</option>
                </select>
            </div>
        </div>

        <button onclick="calculateTrade()">Calculate Trade Cost</button>
        <div id="result"></div>
    </div>

      async function loadPokemonList() {
          // Parse the embedded data
          var itr = 0;
            const items = pokemonData.split('\n')
                .filter(line => line.trim() !== '')
                  .map(line => {
                    const [dexnum, name, legendary, shiny, gmax] = line.split(',');
                    itr += 1;
                    return {
                        id: itr,
                        dexnum: dexnum,
                        name: name,
                        legendary: legendary === 'true',
                        shiny: shiny === 'true',
                        gmax: gmax === 'true'
                    };
                  });
            return items;
        }

        async function populateDropdowns() {
            const dropdown1 = document.getElementById('item1');
            const dropdown2 = document.getElementById('item2');
            items = await loadPokemonList();
            window.items = items; // Make items globally available for the calculate function
            console.log(items);
            items.forEach(item => {
                const option1 = new Option(item.name, item.id);
                const option2 = new Option(item.name, item.id);
                dropdown1.add(option1);
                dropdown2.add(option2);
            });

            updatePokemonImage(dropdown1, 'pokemonImage1');
            updatePokemonImage(dropdown2, 'pokemonImage2');
        }

        function updatePokemonImage(selectElement, imageId) {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const item = items.find(item => item.id == selectedOption.value);
            const imageUrl = getImageUrl(item);
            document.getElementById(imageId).src = imageUrl;
        }

         function getImageUrlScarletViolet(item) {
               if (item.shiny) {
                   return `https://www.serebii.net/Shiny/SV/new/${item.dexnum.padStart(3, '0')}.png`;
               }
               return `https://www.serebii.net/scarletviolet/pokemon/new/${item.dexnum.padStart(3, '0')}.png`;
         }

        function getImageUrl(item) {
            if (parseInt(item.dexnum) >= 906) {
                return getImageUrlScarletViolet(item);
            }

            if (item.shiny) {
                return `https://www.serebii.net/Shiny/SWSH/${item.dexnum.padStart(3, '0')}${item.gmax ? '-gi' : ''}.png`;
            }
            return `https://www.serebii.net/swordshield/pokemon/${item.dexnum.padStart(3, '0')}${item.gmax ? '-gi' : ''}.png`;
        }

        function getTradeCost(rare, registered, friendship_multiplier) {
            if (rare && registered) {
                return 20000 * friendship_multiplier;
            }
            if (rare) {
                return 1000000 * friendship_multiplier;
            }
            if (!registered) {
                return 20000 * friendship_multiplier;
            }
            return 100;
        }

        function calculateTrade() {
            const item1 = items.find(item => item.id == document.getElementById('item1').value);
            const item2 = items.find(item => item.id == document.getElementById('item2').value);
            const friendshipMultiplier = parseFloat(document.getElementById('friendship').value);

            const registeredTrade = document.getElementById('registered1').checked && document.getElementById('registered2').checked;
            const rareTrade = item1.shiny || item2.shiny || item1.legendary || item2.legendary || item1.gmax || item2.gmax;
            const specialTrade = !registeredTrade || rareTrade;

            const tradeCost = getTradeCost(rareTrade, registeredTrade, friendshipMultiplier);

            document.getElementById('result').innerHTML = `
                <strong>Trade Cost:</strong> ${tradeCost.toLocaleString()} stardust<br>
                <strong>Pokémon Registration:</strong> ${registeredTrade ? 'Yes': 'No'}<br>
                <strong>Special Trade:</strong> ${specialTrade ? 'Yes': 'No'}
            `;
        }

        window.onload = populateDropdowns;
    </script>
